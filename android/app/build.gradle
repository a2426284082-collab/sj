plugins { id 'com.android.application' }

android {
    namespace 'app.cike.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'app.cike.mobile'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
